name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.11"
          args: "check --output-format=github"
          src: "."

      - name: Check formatting
        run: ruff format --check .
